[package]
name = "sirius-reborn-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.37", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.35", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1.35"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "rust_decimal", "chrono"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
# 認証（Phase 3）: パスワードの Argon2id ハッシュと OsRng 乱数（std で getrandom を有効化）
argon2 = { version = "0.5.3", features = ["std"] }
# セッショントークンの SHA-256（DBにはハッシュのみ保存）
sha2 = "0.10"
