<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Sirius Reborn — 工事原価コックピット</title>
    <style>
      :root {
        --bg-main: #f5f7fb;
        --bg-card: #ffffff;
        --bg-subtle: #eef2f8;
        --text-main: #0f172a;
        --text-heading: #162447;
        --text-muted: #475569;
        --border-color: #dbe2ef;
        --accent-primary: #0d9488;
        --accent-primary-hover: #0f766e;
        --accent-primary-light: #ccfbf1;
        --accent-secondary: #1e3a8a;
        --danger: #dc2626;
        --danger-bg: #fef2f2;
        --danger-border: #fca5a5;
        --warning: #b45309;
        --warning-bg: #fffbeb;
        --warning-border: #fcd34d;
        --success: #15803d;
        --success-bg: #f0fdf4;
        --success-border: #86efac;
        --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
        --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-main);
        color: var(--text-main);
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Meiryo",
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      /* App Shell & Header */
      .app-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .app-header {
        background: linear-gradient(135deg, #0f172a 0%, #162447 100%);
        color: #ffffff;
        padding: 12px 20px;
        box-shadow: var(--shadow-md);
        position: sticky;
        top: 0;
        z-index: 40;
      }

      .app-header-inner {
        max-width: 1360px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-badge {
        background-color: var(--accent-primary);
        color: #ffffff;
        font-weight: 700;
        font-size: 0.78rem;
        padding: 4px 10px;
        border-radius: 999px;
        letter-spacing: 0.04em;
      }

      .brand-title {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 700;
        color: #ffffff;
      }

      .brand-subtitle {
        margin: 0;
        font-size: 0.78rem;
        color: #cbd5e1;
      }

      .nav-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .nav-tab-btn {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.22);
        background-color: rgba(255, 255, 255, 0.08);
        color: #f8fafc;
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      }

      .nav-tab-btn:hover {
        background-color: rgba(255, 255, 255, 0.16);
      }

      .nav-tab-btn.active {
        background-color: var(--accent-primary);
        border-color: #2dd4bf;
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(13, 148, 136, 0.4);
      }

      .app-main {
        flex: 1;
        width: 100%;
        max-width: 1360px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }

      /* Common Cards & Sections */
      .card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 18px 20px;
        box-shadow: var(--shadow-sm);
        margin-bottom: 18px;
      }

      .section-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }

      .section-title {
        margin: 0;
        font-size: 1.08rem;
        font-weight: 700;
        color: var(--text-heading);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .section-subtitle {
        margin: 2px 0 0;
        font-size: 0.84rem;
        color: var(--text-muted);
      }

      /* Controls & Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 16px;
        border-radius: var(--radius-sm);
        font-size: 0.9rem;
        font-weight: 600;
        border: 1px solid transparent;
        cursor: pointer;
        transition: background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .btn-primary {
        background-color: var(--accent-primary);
        color: #ffffff;
      }

      .btn-primary:hover:not(:disabled) {
        background-color: var(--accent-primary-hover);
      }

      .btn-secondary {
        background-color: #ffffff;
        color: var(--text-heading);
        border-color: var(--border-color);
      }

      .btn-secondary:hover:not(:disabled) {
        background-color: var(--bg-subtle);
      }

      /* Selector & Branch Tabs */
      .selector-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      @media (min-width: 768px) {
        .selector-grid {
          grid-template-columns: minmax(260px, 380px) 1fr;
          align-items: end;
        }
      }

      .form-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-label {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--text-heading);
      }

      .form-select,
      .form-input,
      .form-textarea {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        background-color: #ffffff;
        color: var(--text-main);
        font-size: 0.95rem;
      }

      .form-select:focus,
      .form-input:focus,
      .form-textarea:focus {
        outline: 2px solid var(--accent-primary);
        outline-offset: 1px;
        border-color: var(--accent-primary);
      }

      .branch-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .branch-tab-btn {
        padding: 8px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-color);
        background-color: var(--bg-subtle);
        color: var(--text-heading);
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .branch-tab-btn:hover {
        border-color: var(--accent-primary);
      }

      .branch-tab-btn.active {
        background-color: var(--text-heading);
        border-color: var(--text-heading);
        color: #ffffff;
      }

      /* Status Badges */
      .status-badge {
        display: inline-flex;
        align-items: center;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .status-0 {
        background-color: #e0f2fe;
        color: #0369a1;
      }

      .status-1 {
        background-color: var(--warning-bg);
        color: var(--warning);
      }

      .status-2,
      .status-3 {
        background-color: #f1f5f9;
        color: #475569;
      }

      /* Alert Banners */
      .alert-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 18px;
      }

      .alert-banner {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        font-size: 0.92rem;
        font-weight: 600;
      }

      .alert-danger {
        background-color: var(--danger-bg);
        border: 1px solid var(--danger-border);
        color: #991b1b;
      }

      .alert-warning {
        background-color: var(--warning-bg);
        border: 1px solid var(--warning-border);
        color: #92400e;
      }

      .alert-success {
        background-color: var(--success-bg);
        border: 1px solid var(--success-border);
        color: #166534;
      }

      /* 5 KPI Cards Grid */
      .kpi-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        margin-bottom: 18px;
      }

      @media (min-width: 640px) {
        .kpi-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 1120px) {
        .kpi-grid {
          grid-template-columns: repeat(5, 1fr);
        }
      }

      .kpi-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 16px;
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 8px;
      }

      .kpi-card.primary-highlight {
        border: 2px solid var(--accent-primary);
        background: linear-gradient(180deg, #f0fdfa 0%, #ffffff 100%);
      }

      .kpi-card.danger-highlight {
        border: 2px solid var(--danger);
        background: linear-gradient(180deg, #fef2f2 0%, #ffffff 100%);
      }

      .kpi-label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }

      .kpi-label {
        font-size: 0.84rem;
        font-weight: 700;
        color: var(--text-muted);
      }

      .kpi-tag {
        font-size: 0.74rem;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 999px;
        background-color: var(--bg-subtle);
        color: var(--text-heading);
      }

      .kpi-amount {
        font-size: 1.42rem;
        font-weight: 800;
        color: var(--text-heading);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
        word-break: break-all;
      }

      .kpi-card.primary-highlight .kpi-amount {
        color: #0f766e;
        font-size: 1.52rem;
      }

      .kpi-card.danger-highlight .kpi-amount {
        color: var(--danger);
      }

      .kpi-subtext {
        font-size: 0.8rem;
        color: var(--text-muted);
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 4px;
        font-variant-numeric: tabular-nums;
      }

      /* Cost Element Breakdown Stacked Bar */
      .stacked-bar-track {
        width: 100%;
        height: 22px;
        background-color: var(--bg-subtle);
        border-radius: 999px;
        overflow: hidden;
        display: flex;
        margin: 12px 0 16px;
      }

      .stacked-bar-segment {
        height: 100%;
        transition: width 0.25s ease;
      }

      .breakdown-list {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      @media (min-width: 768px) {
        .breakdown-list {
          grid-template-columns: repeat(5, 1fr);
        }
      }

      .breakdown-item {
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        padding: 12px;
        background-color: #fafcff;
      }

      .breakdown-item-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        margin-bottom: 6px;
      }

      .breakdown-dot-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.84rem;
        font-weight: 700;
        color: var(--text-heading);
      }

      .color-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .breakdown-amount {
        font-size: 1.05rem;
        font-weight: 800;
        color: var(--text-heading);
        font-variant-numeric: tabular-nums;
      }

      .breakdown-percent {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }

      /* Work Type Table */
      .table-scroll-container {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
      }

      .data-table {
        width: 100%;
        min-width: 760px;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      .data-table th,
      .data-table td {
        padding: 11px 12px;
        border-bottom: 1px solid var(--border-color);
        text-align: left;
      }

      .data-table th {
        background-color: var(--bg-subtle);
        color: var(--text-heading);
        font-weight: 700;
        font-size: 0.82rem;
        white-space: nowrap;
      }

      .data-table td.num,
      .data-table th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .data-table tbody tr:hover {
        background-color: #f8fafc;
      }

      .data-table tfoot td {
        background-color: #f1f5f9;
        font-weight: 800;
        border-top: 2px solid var(--border-color);
      }

      .code-pill {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.8rem;
        background-color: var(--bg-subtle);
        color: var(--text-heading);
        padding: 2px 6px;
        border-radius: 4px;
      }

      .progress-cell {
        min-width: 140px;
      }

      .progress-bar-bg {
        width: 100%;
        height: 8px;
        background-color: #e2e8f0;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 4px;
      }

      .progress-bar-fill {
        height: 100%;
        border-radius: 999px;
        background-color: var(--accent-primary);
      }

      .progress-bar-fill.exceeded {
        background-color: var(--danger);
      }

      .text-danger {
        color: var(--danger) !important;
        font-weight: 700;
      }

      /* Form Grids for Easy Input */
      .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      @media (min-width: 640px) {
        .form-grid-2 {
          grid-template-columns: repeat(2, 1fr);
        }
        .form-grid-3 {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .chip-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip-btn {
        padding: 7px 12px;
        border-radius: 999px;
        border: 1px solid var(--border-color);
        background-color: #ffffff;
        color: var(--text-heading);
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
      }

      .chip-btn:hover,
      .chip-btn.active {
        background-color: var(--accent-primary-light);
        border-color: var(--accent-primary);
        color: #0f766e;
      }

      .preview-box {
        background-color: #f8fafc;
        border: 1px solid var(--border-color);
        border-left: 4px solid var(--accent-primary);
        border-radius: var(--radius-sm);
        padding: 14px 16px;
        margin: 14px 0;
      }

      .state-box {
        text-align: center;
        padding: 36px 20px;
      }

      /* 予算・発注（登録と承認）: 375px 幅でも横スクロールが出ないよう、表ではなく折り返す行で表示する */
      .rev-root {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .rev-columns {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 18px;
      }

      @media (min-width: 1024px) {
        .rev-columns {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
      }

      .rev-col {
        min-width: 0;
      }

      .rev-h3 {
        margin: 0 0 8px;
        font-size: 0.98rem;
        color: var(--text-heading);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .rev-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .rev-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 6px 12px;
        padding: 8px 10px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        background-color: #ffffff;
        min-width: 0;
      }

      .rev-row-main {
        flex: 1 1 220px;
        min-width: 0;
      }

      .rev-row-amount {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .rev-total {
        margin-bottom: 8px;
      }

      .rev-muted {
        color: var(--text-muted);
        font-size: 0.84rem;
      }

      .rev-reason {
        margin: 6px 0 0;
        font-size: 0.82rem;
        color: var(--warning);
      }

      .rev-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
      }

      .rev-badge {
        display: inline-flex;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 0.76rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .rev-badge-draft {
        background-color: #e0f2fe;
        color: #0369a1;
      }

      .rev-badge-approved {
        background-color: var(--success-bg);
        color: var(--success);
      }

      .rev-badge-rejected {
        background-color: var(--danger-bg);
        color: var(--danger);
      }

      .rev-diff {
        margin: 6px 0 0;
        padding-left: 18px;
        font-size: 0.86rem;
      }

      .rev-diff-add {
        color: var(--success);
      }

      .rev-diff-del {
        color: var(--danger);
        text-decoration: line-through;
      }

      .rev-diff-chg {
        color: var(--warning);
      }

      .rev-editor,
      .rev-panel,
      .rev-new-order {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }

      .rev-panel,
      .rev-new-order {
        margin-top: 14px;
        padding: 14px;
        border: 1px dashed var(--border-color);
        border-radius: var(--radius-sm);
        background-color: #f8fafc;
      }

      .rev-line-editor {
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        margin: 0;
        min-width: 0;
      }

      .rev-line-editor legend {
        font-weight: 700;
        font-size: 0.86rem;
        padding: 0 4px;
      }

      .rev-order {
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        padding: 10px 12px;
        min-width: 0;
      }

      .rev-order-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .rev-pair {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 6px;
      }

      .rev-check {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.9rem;
      }

      .rev-approve {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--border-color);
      }

      /* 長い選択肢（工種名など）でグリッド列が画面幅を超えないようにする */
      .rev-root .form-grid > *,
      .rev-root .form-field {
        min-width: 0;
      }

      .rev-root .form-select {
        max-width: 100%;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
